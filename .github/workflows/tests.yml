name: tests

on:
  push:
  pull_request:

jobs:
  maestra:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Plugins al día
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python tools/generar-plugins.py
          git diff --exit-code -- .claude-plugin plugins || (echo "Ejecuta python3 tools/generar-plugins.py y sube el resultado" && exit 1)
      - name: Tests de s0k1x-maestra
        run: python -m unittest discover -s tests -v
